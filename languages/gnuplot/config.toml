name = "Gnuplot"
code_fence_block_name = "gnuplot"
grammar = "gnuplot"
path_suffixes = ["gnu", "gp", "gnuplot", "plt", "plot"]
line_comments = ["# "]
autoclose_before = ";:.,=}])>"
decrease_indent_patterns = [
    { pattern = "^\\s*else\\b", valid_after = ["if"] },
    { pattern = "^\\s*unset\\s+multiplot\\b", valid_after = ["multiplot"] },
]
brackets = [
    { start = "[", end = "]", close = true, newline = true, not_in = ["string", "comment"] },
    { start = "(", end = ")", close = true, newline = true, not_in = ["string", "comment"] },
    { start = "{", end = "}", close = true, newline = true, not_in = ["string", "comment"] },
    { start = "\"", end = "\"", close = true, newline = false, not_in = [
        "string",
        "comment",
    ] },
    { start = "'", end = "'", close = true, newline = false, not_in = [
        "string",
        "comment",
    ] },
]
